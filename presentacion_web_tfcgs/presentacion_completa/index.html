<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento de Proyectos TFCGS - Presentación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .presentation-container {
            width: 100%;
            max-width: 1280px;
            height: 720px;
            position: relative;
            background: #fff;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
        }

        .slide.active {
            display: block;
        }

        .slide iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 50px;
            z-index: 1000;
        }

        .controls button {
            background: #0047AB;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #10B981;
            transform: scale(1.1);
        }

        .controls button:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .controls button:disabled:hover {
            transform: scale(1);
        }

        .slide-counter {
            color: white;
            font-size: 16px;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: #10B981;
            transition: width 0.3s;
            z-index: 1001;
        }

        @media (max-width: 1280px) {
            .presentation-container {
                width: 100vw;
                height: 56.25vw; /* 16:9 aspect ratio */
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    

    <div class="presentation-container" id="presentationContainer">
        <div class="slide active" data-slide="1">
            <iframe src="slide_01_portada.html"></iframe>
        </div>
        <div class="slide" data-slide="2">
            <iframe src="slide_02_problema.html"></iframe>
        </div>
        <div class="slide" data-slide="3">
            <iframe src="slide_03_solucion.html"></iframe>
        </div>
        <div class="slide" data-slide="4">
            <iframe src="slide_04_caracteristicas.html"></iframe>
        </div>
        <div class="slide" data-slide="5">
            <iframe src="slide_05_demo_estudiante.html"></iframe>
        </div>
        <div class="slide" data-slide="6">
            <iframe src="slide_06_demo_tutor.html"></iframe>
        </div>
        <div class="slide" data-slide="7">
            <iframe src="slide_07_demo_admin.html"></iframe>
        </div>
        <div class="slide" data-slide="8">
            <iframe src="slide_08_arquitectura.html"></iframe>
        </div>
        <div class="slide" data-slide="9">
            <iframe src="slide_09_seguridad_rls.html"></iframe>
        </div>
        <div class="slide" data-slide="10">
            <iframe src="slide_10_bloc.html"></iframe>
        </div>
        <div class="slide" data-slide="11">
            <iframe src="slide_11_hitos.html"></iframe>
        </div>
        <div class="slide" data-slide="12">
            <iframe src="slide_12_dificultades.html"></iframe>
        </div>
        <div class="slide" data-slide="13">
            <iframe src="slide_13_futuro.html"></iframe>
        </div>
        <div class="slide" data-slide="14">
            <iframe src="slide_14_conclusiones.html"></iframe>
        </div>
        <div class="slide" data-slide="15">
            <iframe src="slide_15_cierre.html"></iframe>
        </div>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevSlide()">←</button>
        <div class="slide-counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">15</span>
        </div>
        <button id="nextBtn" onclick="nextSlide()">→</button>
    </div>

    <script>
        let currentSlide = 1;
        const totalSlides = 15;

        function updateSlide() {
            // Hide all slides
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });

            // Show current slide
            document.querySelector(`.slide[data-slide="${currentSlide}"]`).classList.add('active');

            // Update counter
            document.getElementById('currentSlide').textContent = currentSlide;

            // Update progress bar
            const progress = (currentSlide / totalSlides) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            // Update button states
            document.getElementById('prevBtn').disabled = currentSlide === 1;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides;
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                updateSlide();
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'Home') {
                e.preventDefault();
                currentSlide = 1;
                updateSlide();
            } else if (e.key === 'End') {
                e.preventDefault();
                currentSlide = totalSlides;
                updateSlide();
            }
        });

        // Initialize
        updateSlide();

    </script>
</body>
</html>
