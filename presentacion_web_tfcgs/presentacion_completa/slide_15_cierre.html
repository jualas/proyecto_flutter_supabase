<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F4F6;
            color: #2F4F4F;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #0047AB;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
        }
        
        h1 {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 60px;
            opacity: 0.9;
        }
        
        .author-block {
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 40px;
            width: 60%;
        }
        
        .author-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .qa-prompt {
            font-size: 18px;
            opacity: 0.8;
            margin-top: 40px;
            font-style: italic;
        }
        
        .page-number {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <h1>Gracias por su Atención</h1>
        <div class="subtitle">Sistema de Seguimiento de Proyectos TFCGS</div>
        
        <div class="author-block">
            <div class="author-name">Juan Antonio Francés</div>
            <div class="qa-prompt">Turno de Preguntas</div>
        </div>
        
        <div class="page-number">15</div>
    </div>
</body>
</html>
