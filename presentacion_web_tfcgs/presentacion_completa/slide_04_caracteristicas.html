<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#F3F4F6;color:#2F4F4F}
        .slide-container{width:1280px;min-height:720px;background:#fff;position:relative;overflow:hidden;padding:60px 40px 20px 40px;display:flex;flex-direction:column}
        h1{font-size:42px;font-weight:700;color:#0047AB;margin-bottom:20px;line-height:1.2}
        .subtitle{font-size:24px;color:#4B5563;margin-bottom:20px;max-width:900px;line-height:1.5;border-left:4px solid #10B981;padding-left:20px}
        .screenshot-container{flex-grow:1;width:100%;display:flex;align-items:flex-start;justify-content:center;box-shadow:0 10px 25px rgba(0,0,0,0.1);border-radius:8px;overflow:hidden;background:#f0f0f0;max-height:382px}
        .screenshot{width:100%;height:auto;object-fit:cover;object-position:top}
        .page-number{position:absolute;bottom:30px;right:30px;font-size:14px;color:#9CA3AF}
    </style>
</head>
<body>
    <div class="slide-container">
        <h1>Funcionalidades Clave: Kanban y Seguimiento</h1>
        <div class="subtitle">Herramienta visual disponible únicamente cuando el anteproyecto ha sido aprobado y se ha creado el proyecto. Permite al alumno organizar sus tareas de forma autónoma como un checklist de logros personal, opaco al tutor.</div>
        <div class="screenshot-container">
            <img src="images/Capturadepantalla2025-12-15180516.png" alt="Tablero Kanban Real" class="screenshot">
        </div>
        <div class="page-number">04</div>
    </div>
</body>
</html>
