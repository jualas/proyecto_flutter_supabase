<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F4F6;
            color: #2F4F4F;
        }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: 100px 1fr;
            grid-template-rows: 1fr auto;
        }
        
        .accent-bar {
            background-color: #0047AB;
            height: 100%;
            grid-row: 1 / -1;
        }
        
        .content-area {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .meta-label {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6B7280;
            margin-bottom: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        
        .meta-label::before {
            content: '';
            display: block;
            width: 40px;
            height: 4px;
            background-color: #10B981;
            margin-right: 15px;
        }
        
        h1 {
            font-size: 72px;
            font-weight: 700;
            color: #1F2937;
            line-height: 1.1;
            margin-bottom: 60px;
            max-width: 900px;
        }
        
        .h1-highlight {
            color: #0047AB;
        }
        
        .author-block {
            border-top: 1px solid #E5E7EB;
            padding-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .author-info {
            display: flex;
            flex-direction: column;
        }
        
        .author-name {
            font-size: 28px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 8px;
        }
        
        .author-role {
            font-size: 20px;
            color: #4B5563;
        }
        
        .institution-info {
            text-align: right;
        }
        
        .institution-name {
            font-size: 20px;
            font-weight: 600;
            color: #1F2937;
            margin-bottom: 5px;
        }
        
        .academic-year {
            font-size: 18px;
            color: #6B7280;
        }
        
        .decorative-circle {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 40px solid rgba(16, 185, 129, 0.05);
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-bar"></div>
        
        <div class="content-area">
            <div class="decorative-circle"></div>
            
            <div class="meta-label">Defensa de Trabajo Final de Grado</div>
            
            <h1>Sistema de Seguimiento de <br><span class="h1-highlight">Proyectos TFCGS</span></h1>
            
            <div class="author-block">
                <div class="author-info">
                    <div class="author-name">Juan Antonio Francés</div>
                    <div class="author-role">Desarrollo de Aplicaciones Multiplataforma</div>
                </div>
                
                <div class="institution-info">
                    <div class="institution-name">Proyecto Final</div>
                    <div class="academic-year">Curso 2024/2025</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
