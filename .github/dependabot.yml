# Dependabot: actualizaciones agrupadas una vez por semana (las de seguridad llegan al momento).
# secure-repo.sh añade un bloque por cada manifiesto detectado; revisa los directorios.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /frontend/docker/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups: { docker: { patterns: ["*"] } }
  - package-ecosystem: pub
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups: { pub: { patterns: ["*"] } }
